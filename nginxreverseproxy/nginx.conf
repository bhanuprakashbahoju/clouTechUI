user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name cloutech.valyrianlabs.in;   # << replace with your actual VPS domain

        location / {
            proxy_pass https://qnszfczlmqjqsnfpjaxj.supabase.co;
            proxy_set_header Host qnszfczlmqjqsnfpjaxj.supabase.co;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_verify off;
        }
    }
}

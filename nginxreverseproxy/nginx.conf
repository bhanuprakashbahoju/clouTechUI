user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Use Google DNS to bypass ISP blocks
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Upstream Supabase
    upstream supabase {
        server qnszfczlmqjqsnfpjaxj.supabase.co:443;
    }

    server {
        listen 80;
        server_name cloutech.valyrianlabs.in;

        location / {
            proxy_pass https://supabase;
            proxy_set_header Host qnszfczlmqjqsnfpjaxj.supabase.co;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSL configuration
            proxy_ssl_verify off;
            proxy_ssl_session_reuse on;
            proxy_ssl_server_name on;
            proxy_ssl_name qnszfczlmqjqsnfpjaxj.supabase.co;
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
